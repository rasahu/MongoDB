spring.application.name=monogoDB
server.port=8090
server.servlet.context-path = /monoDbExample


# Mongo DB configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=rakeshdb

amazon.s3.properties.endpoint-url=${S3_ENDPOINT_URL}
amazon.s3.properties.access-key=${S3_ACCESS_KEY}
amazon.s3.properties.secret-key=${S3_SECRET_KEY}
amazon.s3.properties.bucket-name=${S3_BUCKET_NAME}
amazon.s3.properties.region-name=${S3_REGION_NAME}




